<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="aframe.min.js"></script>
    <script src="mindar-image-aframe.prod.js"></script>
    <title>Cat</title>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: targets.mind"
             renderer="colorManagement: true; physicallyCorrectLights: true">

        <a-assets>
            <a-asset-item id="model" src="model/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="1 1 1"></a-entity>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#model" scale="1 1 1"></a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
